# License check for the desktop shell's crates: cargo deny check licenses
# The allow-list equals ALLOWED in tools/license_audit.py; service/tests/test_license_audit.py keeps them equal.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "HPND",
    "ISC",
    "MIT",
    "MIT-0",
    "MIT-CMU",
    "MPL-2.0",
    "PSF-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list is shared with the Python and npm checks, so most entries never occur among the crates.
unused-allowed-license = "allow"
