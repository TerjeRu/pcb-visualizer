[package]
name = "pcbv-desktop"
version = "0.1.1"
description = "PCB Visualizer desktop shell: windows around the local pcbv service"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
