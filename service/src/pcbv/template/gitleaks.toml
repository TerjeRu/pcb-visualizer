# Written by pcbv repo init. The default gitleaks rules plus patterns for the
# credentials that show up in router boot logs, NVRAM dumps and config exports. Spaces in the
# credential rule are [ \t] so a login prompt ("Password:") at the end of a line does not take the
# first word of the next line as its value.
title = "pcbv data repo"

[extend]
useDefault = true

[[rules]]
id = "router-credential"
description = "Password, passphrase or key assigned in a router config, NVRAM dump or boot log"
regex = '''(?i)\b(?:wpa_?passphrase|wpa_?psk|wpa_?key|wl\d?_?wpa_psk|psk|ppp(?:oe)?_?(?:password|passwd|pass|secret)|sip_?(?:password|passwd|auth_?pass)|voip_?(?:password|passwd)|cwmp_?(?:password|passwd)|tr069_?(?:password|passwd)|acs_?(?:password|passwd)|connection_?request_?password|admin_?(?:password|passwd)|root_?(?:password|passwd)|http_?passwd|passwd|password)[ \t]*[=:][ \t]*["']?([^\s"']{4,})'''
secretGroup = 1
keywords = ["pass", "psk", "secret", "key"]

[[rules.allowlists]]
description = "masked or placeholder values, as printed by login prompts and config dumps"
regexes = ['''^(?:\*+|x+|<[^>]*>|\$\{?\w+\}?)$''']

[[rules]]
id = "unix-password-hash"
description = "crypt(3) password hash, as found in /etc/shadow or passwd copies"
regex = '''\$(?:1|5|6|2[aby])\$[./0-9A-Za-z]{1,16}\$[./0-9A-Za-z]{20,}'''
keywords = ["$1$", "$5$", "$6$", "$2a$", "$2b$", "$2y$"]
