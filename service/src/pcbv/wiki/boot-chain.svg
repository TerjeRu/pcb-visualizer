<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" width="760" height="225" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13" fill="#1b1f24">
  <rect width="760" height="225" fill="#ffffff"/>
  <rect x="12" y="60" width="106" height="56" rx="6" fill="#d9dde2" stroke="#1b1f24" stroke-width="2"/>
  <text x="65" y="93" text-anchor="middle" font-weight="600">Boot ROM</text>
  <text x="65" y="136" text-anchor="middle" fill="#5b6470" font-size="11">inside the SoC</text>
  <path d="M120 88 H132" stroke="#1b1f24" stroke-width="2"/><path d="M128 83 L134 88 L128 93 Z" fill="#1b1f24"/>
  <rect x="136" y="60" width="106" height="56" rx="6" fill="#eef0f3" stroke="#1b1f24" stroke-width="2"/>
  <text x="189" y="93" text-anchor="middle" font-weight="600">SPL</text>
  <text x="189" y="136" text-anchor="middle" fill="#5b6470" font-size="11">flash</text>
  <path d="M244 88 H256" stroke="#1b1f24" stroke-width="2"/><path d="M252 83 L258 88 L252 93 Z" fill="#1b1f24"/>
  <rect x="260" y="60" width="106" height="56" rx="6" fill="#eef0f3" stroke="#1b1f24" stroke-width="2"/>
  <text x="313" y="93" text-anchor="middle" font-weight="600">U-Boot</text>
  <text x="313" y="136" text-anchor="middle" fill="#5b6470" font-size="11">flash</text>
  <path d="M368 88 H380" stroke="#1b1f24" stroke-width="2"/><path d="M376 83 L382 88 L376 93 Z" fill="#1b1f24"/>
  <rect x="384" y="60" width="106" height="56" rx="6" fill="#eef0f3" stroke="#1b1f24" stroke-width="2"/>
  <text x="437" y="93" text-anchor="middle" font-weight="600">Kernel</text>
  <text x="437" y="136" text-anchor="middle" fill="#5b6470" font-size="11">flash, run in RAM</text>
  <path d="M492 88 H504" stroke="#1b1f24" stroke-width="2"/><path d="M500 83 L506 88 L500 93 Z" fill="#1b1f24"/>
  <rect x="508" y="60" width="106" height="56" rx="6" fill="#eef0f3" stroke="#1b1f24" stroke-width="2"/>
  <text x="561" y="93" text-anchor="middle" font-weight="600">Init</text>
  <text x="561" y="136" text-anchor="middle" fill="#5b6470" font-size="11">root filesystem</text>
  <path d="M616 88 H628" stroke="#1b1f24" stroke-width="2"/><path d="M624 83 L630 88 L624 93 Z" fill="#1b1f24"/>
  <rect x="632" y="60" width="106" height="56" rx="6" fill="#eef0f3" stroke="#1b1f24" stroke-width="2"/>
  <text x="685" y="93" text-anchor="middle" font-weight="600">Services</text>
  <text x="685" y="136" text-anchor="middle" fill="#5b6470" font-size="11">root filesystem</text>
  <path d="M260 40 H384" stroke="#b45309" stroke-width="2" fill="none"/><path d="M380 35 L388 40 L380 45 Z" fill="#b45309"/>
  <text x="322" y="30" text-anchor="middle" fill="#b45309" font-size="11">kernel command line (bootargs)</text>
  <path d="M260 160 H756" stroke="#b45309" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <text x="260" y="184" fill="#1b1f24" font-size="12">Console output usually starts with the U-Boot banner and runs to the login prompt.</text>
  <text x="12" y="210" fill="#5b6470" font-size="12">The boot ROM cannot be changed. Each later stage is stored in flash and can be replaced, unless secure boot checks its signature.</text>
</svg>
