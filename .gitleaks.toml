# Secret scan for this repository: the rules of the data repository template, plus the files that hold
# test data on purpose. The redaction, data-repo and export tests need fake router passwords, password
# hashes and PEM keys, and the vendored xterm.js has a minified name that looks like an API key.
# A path here is skipped completely, so add a file only when all its findings are deliberate test data.
title = "pcb-visualizer source"

[extend]
path = "service/src/pcbv/template/gitleaks.toml"

[[allowlists]]
description = "deliberate fake credentials in tests, and vendored minified code"
paths = [
  '''^service/tests/test_(?:redact|datarepo|export)\.py$''',
  '''^app/vendor/xterm/xterm\.js$''',
]

[[allowlists]]
# The fingerprint of the package signing key is public: the README prints it for pacman-key. The
# generic-api-key rule reads it as a key wherever a script names it. Only this exact value is allowed.
description = "public fingerprint of the package signing key"
regexes = [
  '''^7ADF401F8B49E82ADB4B3DD0F8348B1E8C5C595B$''',
]
